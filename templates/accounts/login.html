{% extends "base.html" %}
{% block title %}ログイン - 営業機会アラートツール{% endblock %}
{% block content %}
<div class="card" style="max-width:420px;margin:60px auto;">
  <h1>ログイン</h1>
  <form method="post">
    {% csrf_token %}
    {% include "_form_fields.html" %}
    <button type="submit" class="btn">ログイン</button>
  </form>
  <p class="muted" style="margin-top:16px;">アカウントをお持ちでない方は <a href="{% url 'accounts:register' %}">新規登録</a></p>
</div>
{% endblock %}
